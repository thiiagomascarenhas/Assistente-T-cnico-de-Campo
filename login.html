<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d9c6f">
<title>Assistente do Técnico de Campo</title>
<style>
  :root {
    --brand: #0d9c6f;
    --brand-dark: #0a7a58;
    --brand-light: #e6f7f1;
    --bg: #f4f6f5;
    --surface: #ffffff;
    --text: #14201c;
    --text-muted: #6b7a75;
    --border: #e6eae8;
    --error: #e11d48;
    --shadow: 0 4px 24px rgba(16, 24, 21, .1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1512;
      --surface: #17201c;
      --text: #eef3f0;
      --text-muted: #8fa19a;
      --border: #24322c;
      --brand-light: #16352a;
      --shadow: 0 4px 24px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border-radius: 20px;
    padding: 34px 28px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .avatar {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--brand), var(--brand-dark));
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
    box-shadow: var(--shadow);
  }
  .avatar svg { width: 30px; height: 30px; }
  h1 { font-size: 18px; text-align: center; margin: 0 0 4px; font-weight: 600; letter-spacing: -.01em; }
  p.subtitle { text-align: center; color: var(--text-muted); font-size: 13.5px; margin: 0 0 26px; }
  label { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; display: block; font-weight: 500; }
  .field { margin-bottom: 16px; }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s ease;
  }
  input:focus { border-color: var(--brand); }
  .error {
    color: var(--error);
    font-size: 13px;
    background: color-mix(in srgb, var(--error) 10%, transparent);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 16px;
    display: none;
  }
  button {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: none;
    background: var(--brand);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .1s ease, opacity .15s ease;
  }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>
<form class="card" id="loginForm">
  <div class="avatar">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 20V11" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><path d="M12 14c0-3.3-2.4-6-5.5-6 0 3.3 2.4 6 5.5 6z" fill="#fff"/><path d="M12 11c0-3.3 2.4-6 5.5-6 0 3.3-2.4 6-5.5 6z" fill="#fff"/></svg>
  </div>
  <h1>Assistente do Técnico de Campo</h1>
  <p class="subtitle">Faça login para continuar</p>

  <div class="error" id="errorMsg"></div>

  <div class="field">
    <label for="username">Usuário</label>
    <input id="username" name="username" autocomplete="username" required>
  </div>
  <div class="field">
    <label for="password">Senha</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
  </div>

  <button type="submit" id="submitBtn">Entrar</button>
</form>

<script>
  const form = document.getElementById("loginForm");
  const errorEl = document.getElementById("errorMsg");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.style.display = "none";
    submitBtn.disabled = true;
    submitBtn.textContent = "Entrando...";

    try {
      const resp = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
        body: JSON.stringify({
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
        }),
      });

      if (resp.ok) {
        window.location.href = "/test";
        return;
      }
      const data = await resp.json().catch(() => ({}));
      errorEl.textContent = data.error || "Não foi possível entrar.";
      errorEl.style.display = "block";
    } catch (err) {
      errorEl.textContent = "Erro de conexão. Tente novamente.";
      errorEl.style.display = "block";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Entrar";
    }
  });
</script>
</body>
</html>
